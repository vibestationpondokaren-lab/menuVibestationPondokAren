<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Vibestation Pondok Aren Menu</title>
<style>
    /* Reset & Base */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #1a2e5a, #050a12);
        color: #fff;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* Header */
    header {
        width: 100%;
        max-width: 1200px;
        padding: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        flex-wrap: wrap;
        gap: 10px;
    }

    .ps-logo {
        font-size: 1.8rem;
        font-weight: bold;
        letter-spacing: 2px;
        color: #00bfff;
    }

    .system-icons {
        font-size: 1.2rem;
        color: #aaa;
    }

    /* Container */
    .container {
        width: 95%;
        max-width: 1200px;
        margin: 30px 0;
    }

    h1 {
        font-size: 2rem;
        margin-bottom: 5px;
        color: #fff;
    }

    .subtitle {
        color: #00bfff;
        margin-bottom: 20px;
        font-weight: 600;
    }

    /* Grid Menu */
    .menu-wrapper {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
    }

    /* Card */
    .category-card {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 15px;
        padding: 20px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(8px);
        transition: transform 0.3s, box-shadow 0.3s;
        display: flex;
        flex-direction: column;
        max-height: 100%;
        overflow-y: auto;
        word-wrap: break-word;
    }

    .category-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .category-card h2 {
        font-size: 1.3rem;
        margin-bottom: 10px;
        border-bottom: 2px solid #00bfff;
        padding-bottom: 5px;
        flex-shrink: 0;
    }

    /* Menu Items */
    .menu-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 12px;
        margin-bottom: 8px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.03);
        transition: 0.3s;
        font-size: 0.9rem;
        word-break: break-word;
    }

    .menu-item:hover {
        background: #00bfff;
        color: #050a12;
        cursor: pointer;
    }

    .menu-item .item-name {
        font-weight: 500;
        word-break: break-word;
    }

    .menu-item .item-price {
        font-weight: bold;
        color: #00bfff;
        white-space: nowrap;
        margin-left: 10px;
    }

    .menu-item:hover .item-price {
        color: #050a12;
    }

    .highlight-item {
    font-size: 1.3rem;
    font-weight: 800;
    letter-spacing: 1px;
}

.highlight-item .item-name,
.highlight-item .item-price {
    color: #000;
}
    

    /* Footer */
    .footer-nav {
        width: 100%;
        max-width: 1200px;
        margin-top: 40px;
        padding: 15px;
        color: #888;
        text-align: center;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Responsive */
    @media (max-width: 768px) {
        h1 { font-size: 1.7rem; }
        .category-card h2 { font-size: 1.2rem; }
        .menu-item { font-size: 0.85rem; padding: 6px 10px; }
    }

    @media (max-width: 480px) {
        header {
            flex-direction: column;
            align-items: flex-start;
        }
        .ps-logo { font-size: 1.5rem; }
        .system-icons { font-size: 1rem; }
        .menu-wrapper { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>

<header>
    <div class="ps-logo">Vibestation Pondok Aren</div>
    <div class="system-icons">△ &nbsp; ○ &nbsp; □ &nbsp; ✕</div>
</header>


<div class="footer-nav">
    Select &nbsp; • &nbsp; Back &nbsp; • &nbsp; Options
</div>

</body>
</html>
